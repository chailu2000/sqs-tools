name: Web App E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: Web App Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps

      # -----------------------------------------------------------------------
      # Start LocalStack (fake AWS)
      # -----------------------------------------------------------------------
      - name: Start LocalStack
        run: |
          docker run -d \
            --name localstack \
            -p 4566:4566 \
            -e SERVICES=sqs,sts \
            -e DEBUG=0 \
            localstack/localstack:latest

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health | grep -q '"sqs"'; then
              echo "LocalStack is ready!"
              exit 0
            fi
            echo "Attempt $i/30: not ready yet..."
            sleep 2
          done
          echo "LocalStack failed to start"
          docker logs localstack
          exit 1

      # -----------------------------------------------------------------------
      # Create test queues in LocalStack
      # -----------------------------------------------------------------------
      - name: Create test queues in LocalStack
        run: |
          aws --endpoint-url=http://localhost:4566 sqs create-queue \
            --queue-name test-queue-1 \
            --region us-east-1
          echo "Created test-queue-1"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      # -----------------------------------------------------------------------
      # Create a fake AWS profile so the backend/tests can select "sqs-tool"
      # -----------------------------------------------------------------------
      - name: Configure fake AWS profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/config << 'EOF'
          [default]
          region = us-east-1

          [profile sqs-tool]
          region = us-east-1
          EOF

          cat > ~/.aws/credentials << 'EOF'
          [default]
          aws_access_key_id = test
          aws_secret_access_key = test

          [sqs-tool]
          aws_access_key_id = test
          aws_secret_access_key = test
          EOF

      # -----------------------------------------------------------------------
      # Build & start backend
      # -----------------------------------------------------------------------
      - name: Build backend
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Clear previous state
        working-directory: backend
        run: rm -rf data && mkdir -p data

      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar build/libs/*.jar > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend started with PID $(cat backend.pid)"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/queues > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Backend log snippet (Attempt $i) ---"
              tail -n 20 backend/backend.log || true
              echo "-----------------------------------------"
            fi
            echo "Attempt $i/60: Backend not ready yet..."
            sleep 2
          done
          echo "Backend failed to start within 120 seconds"
          cat backend/backend.log || true
          exit 1

      # -----------------------------------------------------------------------
      # Run E2E tests
      # -----------------------------------------------------------------------
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list --update-snapshots=missing
        env:
          CI: true

      # -----------------------------------------------------------------------
      # Artifacts
      # -----------------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Stop LocalStack
        if: always()
        run: docker stop localstack && docker rm localstack || true
