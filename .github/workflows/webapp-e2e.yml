name: Web App E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    name: Web App Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # Build & start backend
      # -----------------------------------------------------------------------
      - name: Build backend
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Start backend
        working-directory: backend
        run: |
          echo "Starting backend..."
          nohup java -jar build/libs/*.jar --spring.profiles.active=test > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend started with PID $(cat backend.pid)"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              curl -s http://localhost:8080/actuator/health | head -20
              exit 0
            fi
            echo "Attempt $i/60: Backend not ready yet..."
            sleep 2
          done
          echo "Backend failed to start within 120 seconds"
          echo "Last 50 lines of backend log:"
          tail -50 backend/backend.log || echo "No backend log found"
          exit 1

      # -----------------------------------------------------------------------
      # Start frontend dev server (used by webServer config in playwright.config)
      # -----------------------------------------------------------------------
      - name: Start frontend dev server
        working-directory: frontend
        run: pnpm run dev &

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Attempt $i/60: Frontend not ready yet..."
            sleep 2
          done
          echo "Frontend failed to start within 120 seconds"
          exit 1

      # -----------------------------------------------------------------------
      # Run E2E tests (Chromium only in CI for speed; remove --project to run all)
      # -----------------------------------------------------------------------
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: pnpm exec playwright test --project=chromium
        env:
          CI: true

      # -----------------------------------------------------------------------
      # Upload artifacts on failure (or always for the HTML report)
      # -----------------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30
