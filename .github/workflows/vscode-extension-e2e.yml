name: VS Code Extension E2E Tests

on:
  push:
    branches: [ main, develop, extension ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: VS Code Extension E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: Cache VS Code binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.vscode-test
            vscode-extension/sqs-management-tool/.vscode-test
          key: vscode-test-ubuntu-${{ hashFiles('vscode-extension/sqs-management-tool/package.json') }}
          restore-keys: |
            vscode-test-ubuntu-
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: vscode-extension/sqs-management-tool/node_modules
          key: node-modules-ubuntu-${{ hashFiles('vscode-extension/sqs-management-tool/pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-ubuntu-
      
      - name: Install dependencies
        working-directory: vscode-extension/sqs-management-tool
        run: pnpm install --frozen-lockfile
      
      - name: Install Xvfb for headless VS Code
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Start LocalStack
        working-directory: vscode-extension/sqs-management-tool
        run: docker compose -f tests/e2e/config/docker-compose.localstack.yml up -d
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      
      - name: Wait for LocalStack health check
        working-directory: vscode-extension/sqs-management-tool
        run: |
          echo "Waiting for LocalStack to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"sqs": "available"'; then
              echo "LocalStack is ready!"
              exit 0
            fi
            echo "Attempt $i: LocalStack not ready yet, waiting..."
            sleep 2
          done
          echo "LocalStack failed to start"
          docker compose -f tests/e2e/config/docker-compose.localstack.yml logs
          exit 1
      
      - name: Set environment variables
        run: |
          echo "AWS_ENDPOINT_URL=http://localhost:4566" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV
      
      - name: Run E2E tests
        working-directory: vscode-extension/sqs-management-tool
        run: xvfb-run -a pnpm run test:e2e:ci
        timeout-minutes: 20
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: vscode-extension/sqs-management-tool/test-results/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: vscode-extension/sqs-management-tool/test-results/screenshots/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: vscode-extension/sqs-management-tool/test-results/logs/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Show LocalStack logs on failure
        if: failure()
        working-directory: vscode-extension/sqs-management-tool
        run: docker compose -f tests/e2e/config/docker-compose.localstack.yml logs
      
      - name: Stop LocalStack
        if: always()
        working-directory: vscode-extension/sqs-management-tool
        run: docker compose -f tests/e2e/config/docker-compose.localstack.yml down

